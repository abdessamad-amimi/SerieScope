<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sériescope</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="js/view/SeriesView.js" type="module"></script>
</head>

<body class="min-h-screen bg-[#111111] text-white">

    <!-- Navbar -->
    <header class="bg-[#090909] px-4 py-3">
        <nav class="mx-auto flex max-w-7xl items-center gap-2">
            <div class="flex h-7 w-7 items-center justify-center rounded-md bg-white text-black">
                <span class="text-sm">▣</span>
            </div>

            <h1 class="text-sm font-bold">Sériescope</h1>
        </nav>
    </header>


    <main class="mx-auto max-w-7xl space-y-5 px-4 py-5">

        <!-- Introduction -->
        <section>
            <h2 class="text-xl font-bold sm:text-2xl">
                Explore les séries TV
            </h2>

            <p class="mt-1 text-xs text-gray-400">
                Retrouve tes séries préférées et enrichis le catalogue.
            </p>
        </section>


        <!-- Add Series Form -->
        <section class="rounded-xl border border-[#333333] bg-[#191919] p-3 sm:p-4">

            <div class="mb-3">
                <h3 class="text-sm font-bold">Ajouter une série</h3>

                <p class="text-xs text-gray-400">
                    Les champs marqués d'un * sont obligatoires.
                </p>
            </div>

            <form class="space-y-3" id="formSubmit">

                <!-- Inputs -->
                <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">

                    <div>
                        <label for="name" class="mb-1 block text-xs font-medium">
                            Nom de la série *
                        </label>

                        <input type="text" id="name" placeholder="Ex. The Bear" aria-describedby="erreur-name"
                            class="w-full rounded-md border border-[#333333] bg-[#111111] px-2 py-2 text-xs outline-none transition focus:border-gray-500">

                        <p id="erreur-name" role="alert" class="mt-1 text-xs text-red-400"></p>
                    </div>

                    <div>
                        <label for="genre" class="mb-1 block text-xs font-medium">
                            Genre(s) *
                        </label>

                        <div
                            class="w-full rounded-md border border-[#333333] bg-[#111111] px-2 py-2 focus-within:border-gray-500">

                            <input type="text" id="genre" autocomplete="off" placeholder="Tapez un genre..."
                                class="block w-full bg-transparent p-0 m-0 text-xs leading-5 outline-none">
                        </div>

                        <div id="genres-selectionnes" class="flex flex-col w-4 flex-wrap gap-2 mb-2 mt-2"></div>

                        <div id="suggestions-genres"
                            class="w-max mt-1 hidden max-h-40 overflow-y-auto rounded-md flex flex-col border border-[#383838] bg-[#202020]">
                        </div>

                        <p id="erreur-genre" role="alert" class="mt-1 text-xs text-red-400"></p>
                    </div>

                </div>


                <!-- Description -->
                <div>
                    <label for="description" class="mb-1 block text-xs font-medium">
                        Description
                        <span class="font-normal text-gray-400">facultative</span>
                    </label>

                    <textarea id="description" rows="3" placeholder="Résume la série en quelques mots..."
                        aria-describedby="erreur-description"
                        class="w-full resize-none rounded-md border border-[#333333] bg-[#111111] px-2 py-2 text-xs outline-none transition focus:border-gray-500"></textarea>

                    <p id="erreur-description" role="alert" class="mt-1 text-xs text-red-400"></p>
                </div>

                <!-- Photo -->
                <div>
                    <label for="image" class="mb-1 block text-xs font-medium">
                        Photo
                        <span class="font-normal text-gray-400"> facultative</span>
                    </label>

                    <input type="file" id="image" accept="image/*" aria-describedby="erreur-image"
                        class="block w-full cursor-pointer text-xs text-gray-400 file:mr-3 file:cursor-pointer file:rounded-md file:border file:border-[#333333] file:bg-[#303030] file:px-3 file:py-2 file:text-xs file:font-semibold file:text-gray-300 file:transition hover:file:bg-[#3a3a3a]">

                    <p id="erreur-image" role="alert" class="mt-1 text-xs text-red-400"></p>

                    <div id="apercu" class="mt-2">
                        <button type="button" id="retirer-image"
                            class="mt-1 text-xs text-gray-400 underline underline-offset-2 transition hover:text-white">
                            Retirer la photo
                        </button>
                    </div>
                </div>


                <!-- Submit -->
                <button type="submit"
                    class="rounded-md bg-white px-3 py-2 text-xs font-semibold text-black transition hover:bg-gray-300">
                    + Ajouter la série
                </button>

            </form>
        </section>


        <!-- Series Catalogue -->
        <section>

            <div class="mb-3">
                <h3 class="text-sm font-bold">Catalogue des séries</h3>

                <p class="mt-1 text-xs text-gray-400">
                    Recherche par nom ou explore un genre.
                </p>
            </div>


            <!-- Search and Filter -->
            <div
                class="grid grid-cols-1 gap-2 rounded-xl border border-[#333333] bg-[#191919] p-2 sm:grid-cols-2 lg:grid-cols-[1.5fr_1fr_auto]">

                <div>
                    <label for="search" class="mb-1 block text-xs">
                        Recherche
                    </label>

                    <input type="search" id="search" placeholder="Ex. Breaking Bad" aria-describedby="erreur-search"
                        class="w-full rounded-md border border-[#333333] bg-[#111111] px-2 py-2 text-xs outline-none focus:border-gray-500">

                    <p id="erreur-search" role="alert" class="mt-1 hidden text-xs text-red-400"></p>
                </div>


                <div>
                    <label for="filter" class="mb-1 block text-xs">
                        Genre
                    </label>

                    <select id="filter" aria-describedby="erreur-filter"
                        class="w-full rounded-md border border-[#333333] bg-[#111111] px-2 py-2 text-xs text-gray-300 outline-none focus:border-gray-500">

                    </select>

                    <p id="erreur-filter" role="alert" class="mt-1 hidden text-xs text-red-400"></p>
                </div>


                <div class="flex items-end">
                    <button type="reset" id="reset"
                        class="w-full rounded-md border border-[#333333] px-3 py-2 text-xs font-semibold transition hover:bg-[#292929] sm:w-auto">
                        ↻ Réinitialiser
                    </button>
                </div>

            </div>


            <!-- Results Counter -->
            <p id="counter" class="my-2 text-xs text-gray-400">
                
            </p>


            <!-- Series Cards -->
            <div id="SeriesCard" class="grid grid-cols-1 gap-2 sm:grid-cols-2 lg:grid-cols-3">


                <!-- Breaking Bad -->

            </div>

        </section>

    </main>

</body>

</html>
